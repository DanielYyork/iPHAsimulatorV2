name: iphasimulatorchannels:  - conda-forge  - nodefaultsdependencies:  # ----------------------------------------------------------  # Python and packaging  # ----------------------------------------------------------  - python=3.12  - pip  - setuptools  - wheel  # ----------------------------------------------------------  # Core scientific Python  # ----------------------------------------------------------  - numpy  - scipy  - pandas  - networkx  - pyyaml  - matplotlib  - numba  - scikit-learn  # ----------------------------------------------------------  # Chemistry and molecular modelling  # ----------------------------------------------------------  - rdkit  - openbabel  - ambertools  - parmed  - openmm  - mdtraj  - mdanalysis  # ----------------------------------------------------------  # Polymer-system preparation  # ----------------------------------------------------------  - acpype  # ----------------------------------------------------------  # GUI / Streamlit  # ----------------------------------------------------------  - streamlit  - pyzmq  - ipython_genutils  - ipywidgets  - traitlets  - widgetsnbextension  - pillow  # ----------------------------------------------------------  # Testing and development  # ----------------------------------------------------------  - pytest  - jupyterlab  # ----------------------------------------------------------  # Pip-only / project-specific packages  # ----------------------------------------------------------  - pip:      - pysmiles==2.1.0      - cgsmiles==1.0.2      - polyply==1.8.0      - py3Dmol      - stmol      - kneed      - -e .