[project]
name = "iphasimulator"
version = "0.1.0"
description = "PHA-specific polymer builder and simulation preparation toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "pandas",
    "pyyaml",
    "rdkit"
]

[project.scripts]
ipha-process-trajectory = "iphasimulator.trajectory_processing:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab"
]
md = [
    "openmm",
    "parmed",
    "mdtraj"
]
analysis = [
    "MDAnalysis>=2.8,<3",
    "matplotlib>=3.7"
]
gui = [
    "streamlit"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iphasimulator = [
    "data/gromacs_mdp/*.mdp",
    "data/gromacs_solvation/*.itp",
    "data/gromacs_solvation/*.mdp",
    "data/charmm_gromacs/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
